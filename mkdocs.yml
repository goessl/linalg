site_name: linalg
site_url: https://goessl.github.io/linalg/
site_author: Sebastian Gössl
site_description: Linear algebra with scalar object support & progress visualisation.

repo_name: goessl/linalg
repo_url: https://github.com/goessl/linalg

copyright: Copyright &copy; 2026 Sebastian Gössl

theme:
  name: material
  features:
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to system preference

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_root_toc_entry: false
            show_symbol_type_heading: true
            members_order: source
            group_by_category: false
            docstring_style: numpy
            docstring_section_style: list
            annotations_path: full

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/goessl/
      name: goessl on Github
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/lordgoessl/
      name: lordgoessl on Instagram

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/edge-cases.css
  - stylesheets/complexity.css
  - stylesheets/see-also.css
  - stylesheets/references.css

extra_javascript:
  - mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - blas.md
  - blas2.md
  - leibniz.md
  - gauss.md
  - rank.md
  - triangular.md
  - ortho.md
  - random.md
  - util.md
  - progress.md
